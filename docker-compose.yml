services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoicetap
      POSTGRES_PASSWORD: invoicetap
      POSTGRES_DB: invoicetap
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invoicetap']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
