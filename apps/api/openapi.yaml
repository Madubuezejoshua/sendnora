openapi: 3.0.3
info:
  title: InvoiceTap API
  version: '1.0'
  description: >
    Business-domain API for InvoiceTap. Authenticated via a short-lived
    bearer token minted by the Next.js app after validating the user's
    session — see ARCHITECTURE.md. Covers every mounted route as of this
    build; see API.md for the same route map in table form with module
    groupings and cross-cutting notes (rate limits, idempotency, webhook
    signature verification) that don't fit cleanly into OpenAPI.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived JWT minted by apps/web from the visitor's session — never
        a long-lived credential. Not usable by third-party clients today; see
        the API keys section for the current, management-only alternative.
  parameters:
    page:
      in: query
      name: page
      schema: { type: integer, default: 1 }
    pageSize:
      in: query
      name: pageSize
      schema: { type: integer, default: 20, maximum: 100 }
    search:
      in: query
      name: search
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing/invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but missing the required permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource in the active workspace
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request body failed schema validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            requestId:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    Money:
      type: object
      description: Minor-unit integer amount plus ISO currency code.
      properties:
        amountMinorUnits:
          type: integer
        currency:
          type: string
          example: NGN
    PaginatedMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    Customer:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [INDIVIDUAL, BUSINESS]
        name:
          type: string
        email:
          type: string
          nullable: true
        whatsappPhone:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
    Product:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [PRODUCT, SERVICE] }
        name: { type: string }
        sku: { type: string, nullable: true }
        unit: { type: string }
        unitPriceMinorUnits: { type: integer }
        currency: { type: string }
    LineItemInput:
      type: object
      required: [description, quantity, unitPriceMinorUnits]
      properties:
        description:
          type: string
        quantity:
          type: number
        unitPriceMinorUnits:
          type: integer
        taxRatePercent:
          type: number
        productId:
          type: string
    Invoice:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        status:
          type: string
          enum: [DRAFT, ISSUED, SENT, VIEWED, PARTIALLY_PAID, PAID, OVERDUE, VOID, CANCELLED]
        currency:
          type: string
        grandTotalMinorUnits:
          type: integer
        amountPaidMinorUnits:
          type: integer
        dueDate:
          type: string
          format: date-time
    Quote:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        status:
          type: string
          enum: [DRAFT, SENT, VIEWED, ACCEPTED, REJECTED, EXPIRED, CANCELLED, CONVERTED]
        currency: { type: string }
        grandTotalMinorUnits: { type: integer }
        expiryDate: { type: string, format: date-time, nullable: true }
    Receipt:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        invoiceId: { type: string }
        amountMinorUnits: { type: integer }
        currency: { type: string }
        paymentMethod: { type: string }
        paidAt: { type: string, format: date-time }
        publicToken: { type: string }
    Expense:
      type: object
      properties:
        id: { type: string }
        vendor: { type: string }
        category: { type: string }
        amountMinorUnits: { type: integer }
        currency: { type: string }
        incurredAt: { type: string, format: date-time }
        isRecurring: { type: boolean }
    RecurringInvoice:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        frequency:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY, QUARTERLY, ANNUAL, CUSTOM]
        status: { type: string, enum: [ACTIVE, PAUSED, ENDED] }
        nextRunAt: { type: string, format: date-time, nullable: true }
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ApiKeySummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
paths:
  # --- Health -----------------------------------------------------------
  /health:
    get:
      summary: Liveness probe
      tags: [Health]
      security: []
      responses:
        '200':
          description: OK
  /ready:
    get:
      summary: Readiness probe — checks database connectivity
      tags: [Health]
      security: []
      responses:
        '200':
          description: Ready
        '503':
          description: Database unreachable

  # --- Customers ----------------------------------------------------------
  /customers:
    get:
      summary: List customers in the active workspace
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/search'
      responses:
        '200':
          description: Paginated customer list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a customer
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                type: { type: string, enum: [INDIVIDUAL, BUSINESS] }
                name: { type: string }
                email: { type: string }
                whatsappPhone: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
        '402':
          description: Plan customer limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers/export:
    get:
      summary: Export all customers as CSV
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
  /customers/import:
    post:
      summary: Bulk-import customers from a CSV file (row-level validation; one bad row never fails the batch)
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imported: { type: integer }
                      skipped: { type: integer }
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            row: { type: integer }
                            message: { type: string }
  /customers/{customerId}:
    get:
      summary: Get a customer
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Customer detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a customer
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated customer
  /customers/{customerId}/statement:
    get:
      summary: Customer statement summary (lifetime billed/paid/outstanding)
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Statement summary
  /customers/{customerId}/archive:
    post:
      summary: Archive a customer (soft delete)
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Archived customer
  /customers/{customerId}/restore:
    post:
      summary: Restore an archived customer
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Restored customer

  # --- Products / categories / tax rates -----------------------------------
  /products:
    get:
      summary: List products
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/search'
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
    post:
      summary: Create a product or service
      tags: [Products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, unitPriceMinorUnits, currency]
              properties:
                kind: { type: string, enum: [PRODUCT, SERVICE] }
                name: { type: string }
                unit: { type: string }
                unitPriceMinorUnits: { type: integer }
                currency: { type: string }
                sku: { type: string }
                taxRateId: { type: string }
                categoryId: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products/export:
    get:
      summary: Export all products as CSV
      tags: [Products]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
  /products/import:
    post:
      summary: Bulk-import products from a CSV file
      tags: [Products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Import summary (same shape as /customers/import)
  /products/{productId}:
    get:
      summary: Get a product
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product detail
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a product
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated product
  /products/{productId}/archive:
    post:
      summary: Archive a product
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Archived product
  /categories:
    get:
      summary: List product categories
      tags: [Products]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Category list
    post:
      summary: Create a product category
      tags: [Products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Created category
  /tax-rates:
    get:
      summary: List tax rates
      tags: [Products]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tax rate list
    post:
      summary: Create a tax rate
      tags: [Products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ratePercent]
              properties:
                name: { type: string }
                ratePercent: { type: number }
                isDefault: { type: boolean }
      responses:
        '201':
          description: Created tax rate

  # --- Quotes ---------------------------------------------------------------
  /quotes:
    get:
      summary: List quotes
      tags: [Quotes]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Paginated quote list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Quote' }
    post:
      summary: Create a draft quote with computed totals
      tags: [Quotes]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, currency, issueDate, lineItems]
              properties:
                customerId: { type: string }
                currency: { type: string }
                taxMode: { type: string, enum: [EXCLUSIVE, INCLUSIVE] }
                issueDate: { type: string, format: date-time }
                expiryDate: { type: string, format: date-time }
                lineItems:
                  type: array
                  items: { $ref: '#/components/schemas/LineItemInput' }
      responses:
        '201':
          description: Created draft quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Quote' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /quotes/{quoteId}:
    get:
      summary: Get a quote
      tags: [Quotes]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Quote detail
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a draft quote
      tags: [Quotes]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated quote
        '409':
          description: Quote is no longer editable (already sent/accepted)
  /quotes/{quoteId}/send:
    post:
      summary: Send a quote to the customer (email/WhatsApp/both)
      tags: [Quotes]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [EMAIL, WHATSAPP, BOTH] }
      responses:
        '200':
          description: Quote transitioned to SENT
  /quotes/{quoteId}/respond:
    post:
      summary: Record the customer's accept/reject decision (internal staff action; the public endpoint is /public/quotes/:token/respond)
      tags: [Quotes]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [ACCEPTED, REJECTED] }
                reason: { type: string }
      responses:
        '200':
          description: Quote transitioned
  /quotes/{quoteId}/cancel:
    post:
      summary: Cancel a quote
      tags: [Quotes]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Quote transitioned to CANCELLED
  /quotes/{quoteId}/pdf:
    get:
      summary: Download the quote PDF
      tags: [Quotes]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: PDF file
          content:
            application/pdf: {}
  /quotes/{quoteId}/duplicate:
    post:
      summary: Duplicate a quote as a new draft
      tags: [Quotes]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: string }
      responses:
        '201':
          description: New draft quote
  /quotes/{quoteId}/convert:
    post:
      summary: Convert an accepted quote to a draft invoice
      tags: [Quotes]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dueDate]
              properties:
                dueDate: { type: string, format: date-time }
      responses:
        '201':
          description: New draft invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Invoice' }

  # --- Invoices ---------------------------------------------------------------
  /invoices:
    get:
      summary: List invoices
      tags: [Invoices]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Paginated invoice list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Invoice' }
    post:
      summary: Create a draft invoice with computed totals
      tags: [Invoices]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, currency, issueDate, dueDate, lineItems]
              properties:
                customerId: { type: string }
                currency: { type: string }
                taxMode: { type: string, enum: [EXCLUSIVE, INCLUSIVE] }
                issueDate: { type: string, format: date-time }
                dueDate: { type: string, format: date-time }
                sourceQuoteId: { type: string }
                lineItems:
                  type: array
                  items: { $ref: '#/components/schemas/LineItemInput' }
      responses:
        '201':
          description: Created draft invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Invoice' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /invoices/{invoiceId}:
    get:
      summary: Get an invoice
      tags: [Invoices]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invoice detail
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a draft invoice
      tags: [Invoices]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated invoice
        '409':
          description: Invoice is no longer editable
  /invoices/{invoiceId}/issue:
    post:
      summary: Transition a draft invoice to ISSUED (enforces plan invoice quota, schedules reminders)
      tags: [Invoices]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Issued invoice
        '402':
          description: Plan invoice quota exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Invalid status transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /invoices/{invoiceId}/send:
    post:
      summary: Send an invoice to the customer (email/WhatsApp/both)
      tags: [Invoices]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [EMAIL, WHATSAPP, BOTH] }
      responses:
        '200':
          description: Invoice transitioned to SENT
  /invoices/{invoiceId}/payments:
    post:
      summary: Record a manual payment against an invoice (generates a Receipt)
      tags: [Invoices]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinorUnits, method, paidAt]
              properties:
                amountMinorUnits: { type: integer }
                method:
                  { type: string, enum: [CASH, BANK_TRANSFER, CARD, PAYSTACK, FLUTTERWAVE, OTHER] }
                paidAt: { type: string, format: date-time }
                reference: { type: string }
                notes: { type: string }
      responses:
        '201':
          description: Payment recorded and receipt generated
        '422':
          description: Payment amount exceeds the outstanding balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /invoices/{invoiceId}/void:
    post:
      summary: Void an issued invoice (requires a reason; blocked once any payment exists)
      tags: [Invoices]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
