  # --- Webhooks (no auth — verified by provider signature instead) ------------
  /webhooks/paystack:
    post:
      summary: >
        Paystack webhook receiver (HMAC-SHA512 signature over the raw body).
        Also routes platform-subscription events (charge.success,
        invoice.payment_failed, subscription.disable/not_renew) to the
        recurring-billing handler before falling through to one-off
        invoice-payment handling.
      tags: [Webhooks]
      security: []
      responses:
        '200':
          description: Acknowledged (processing happens asynchronously after ack)
        '400':
          description: Invalid signature
  /webhooks/flutterwave:
    post:
      summary: Flutterwave webhook receiver (verif-hash constant-time comparison)
      tags: [Webhooks]
      security: []
      responses:
        '200':
          description: Acknowledged
        '400':
          description: Invalid signature
  /webhooks/whatsapp:
    get:
      summary: Meta Cloud API subscription verification handshake (register this URL in the Meta App dashboard)
      tags: [Webhooks]
      security: []
      parameters:
        - in: query
          name: hub.mode
          schema: { type: string }
        - in: query
          name: hub.verify_token
          schema: { type: string }
        - in: query
          name: hub.challenge
          schema: { type: string }
      responses:
        '200':
          description: Echoes hub.challenge back
        '403':
          description: Unknown or missing verify token
    post:
      summary: Meta Cloud API delivery-status callback (X-Hub-Signature-256 verified) — updates MessageDelivery rows
      tags: [Webhooks]
      security: []
      responses:
        '200':
          description: Acknowledged
        '400':
          description: Invalid signature

  # --- Cron (CRON_SECRET bearer, not a user session) --------------------------
  /cron/overdue-sweep:
    post:
      summary: Mark ISSUED/SENT/VIEWED/PARTIALLY_PAID invoices past their due date as OVERDUE
      tags: [Cron]
      security: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string, example: 'Bearer <CRON_SECRET>' }
      responses:
        '200':
          description: Number of invoices swept
        '401':
          description: Invalid cron secret
  /cron/recurring-invoices:
    post:
      summary: Generate due invoices from active recurring schedules
      tags: [Cron]
      security: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string, example: 'Bearer <CRON_SECRET>' }
      responses:
        '200':
          description: Number of invoices generated
        '401':
          description: Invalid cron secret
  /cron/reminders:
    post:
      summary: Dispatch due ReminderSchedule rows (email auto-sends; WhatsApp auto-sends only with Meta Cloud API configured, otherwise creates a notification)
      tags: [Cron]
      security: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string, example: 'Bearer <CRON_SECRET>' }
      responses:
        '200':
          description: '{ processed, skipped }'
        '401':
          description: Invalid cron secret

  # --- Contact / support -------------------------------------------------------
  /contact:
    post:
      summary: Marketing-site contact form submission (public, rate-limited)
      tags: [Contact]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                message: { type: string }
      responses:
        '201':
          description: Submission recorded
  /support-tickets:
    get:
      summary: List the caller's support tickets
      tags: [Contact]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ticket list
    post:
      summary: Create a support ticket
      tags: [Contact]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                subject: { type: string }
                message: { type: string }
      responses:
        '201':
          description: Created ticket
