          required: true
          schema: { type: string }
      responses:
        '200':
          description: Quote detail for public display
        '404':
          description: Unknown or revoked token
  /public/quotes/{token}/respond:
    post:
      summary: Customer accepts or rejects a quote (public equivalent of the internal /quotes/:id/respond)
      tags: [Public]
      security: []
      parameters:
        - in: path
          name: token
