openapi: 3.0.3
info:
  title: Sendnaro API
  version: '1'
  description: |
    Send invoices, WhatsApp verification codes and order updates from your backend.

    **Authentication.** `Authorization: Bearer sn_test_...` (sandbox) or `sn_live_...` (live). Keys are
    server-side secrets: never put them in browser code, mobile apps, query strings or `NEXT_PUBLIC_` variables.
    The tenant and environment come from the key; no body field can override them.

    **Accepted is not delivered.** Endpoints that trigger delivery return `202 Accepted` after the request
    is durably queued. Track the outcome with `GET /deliveries/{id}` or signed webhooks.

    **Amounts** are integer minor units (`500000` = NGN 5,000.00). Totals are calculated by Sendnaro.

    **Idempotency.** Send an `Idempotency-Key` header on POSTs that create something. The same key with the
    same body returns the original response (`Idempotent-Replayed: true`); with a different body it returns
    `409 idempotency_conflict`. Keys are kept for 24 hours.

    **Errors** always look like `{ "error": { "code", "message", "request_id", "fields"? } }`.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (the intended production base URL is https://sendnaro.com/api/v1 once deployed)
security:
  - bearerAuth: []
tags:
  - name: Invoices
  - name: OTP
  - name: Notifications
  - name: Deliveries
  - name: Telegram
  - name: Sandbox
paths:
  /ping:
    get:
      summary: Check a key
      description: Returns the key's environment and scopes. Requires no scope.
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /invoices:
    post:
      tags: [Invoices]
      summary: Create an invoice or receipt and deliver it
      description: Requires scope `invoices:create`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvoice' }
      responses:
        '202':
          description: Accepted for processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /invoices/{invoice_id}:
    get:
      tags: [Invoices]
      summary: Retrieve an invoice
      description: Requires scope `invoices:read`. `pdf.url` is a short-lived signed link once the PDF exists.
      parameters:
        - { name: invoice_id, in: path, required: true, schema: { type: string, example: inv_cm0abc123 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }
  /otp/challenges:
    post:
      tags: [OTP]
      summary: Send a WhatsApp verification code
      description: >
        Requires scope `otp:create`. The response never contains the code. Verifying a code proves access to the
        WhatsApp number only; it does not verify an email address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOtp' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /otp/challenges/{challenge_id}/resend:
    post:
      tags: [OTP]
      summary: Send a fresh code (the previous code stops working)
      description: Requires scope `otp:create`. Subject to a cooldown and a resend cap.
      parameters:
        - { name: challenge_id, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /otp/challenges/{challenge_id}/verify:
    post:
      tags: [OTP]
      summary: Verify a code (single use)
      description: >
        Requires scope `otp:verify`. Checked against this business, environment, challenge, recipient and purpose.
        Errors: `otp_invalid` (with attempts remaining), `otp_expired`, `otp_locked`.
      parameters:
        - { name: challenge_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtp' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /notifications:
    post:
      tags: [Notifications]
      summary: Send an order or payment update
      description: Requires scope `notifications:send`. Fixed message types; links must be on the business's allow-list.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNotification' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /deliveries/{delivery_id}:
    get:
      tags: [Deliveries]
      summary: Retrieve a delivery and its attempts
      description: Requires scope `deliveries:read`.
      parameters:
        - { name: delivery_id, in: path, required: true, schema: { type: string, example: dlv_cm0abc123 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '404': { $ref: '#/components/responses/NotFound' }
  /telegram/link-tokens:
    post:
      tags: [Telegram]
      summary: Create a one-time Telegram connection link for a customer
      description: >
        Requires scope `telegram:link`. A bot cannot message a customer first: the customer opens the link and
        presses Start. The link is single use and expires in 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLinkToken' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkToken' }
        '409': { $ref: '#/components/responses/Conflict' }
  /telegram/links/{external_customer_id}:
    delete:
      tags: [Telegram]
      summary: Disconnect a customer's Telegram
      description: Requires scope `telegram:link`.
      parameters:
        - { name: external_customer_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Disconnected }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandbox/otp-inbox:
    get:
      tags: [Sandbox]
      summary: Read the codes a simulated phone received (sandbox keys only)
      description: Requires scope `otp:create`. Live keys receive `403 sandbox_only`.
      parameters:
        - { name: phone, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sandbox/telegram/start:
    post:
      tags: [Sandbox]
      summary: Simulate a customer pressing Start in the Telegram bot (sandbox keys only)
      description: Requires scope `telegram:link`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                chat_id: { type: string }
      responses:
        '200': { description: Linked }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sandbox/process-queue:
    post:
      tags: [Sandbox]
      summary: Run this business's queued sandbox jobs now (sandbox keys only)
      description: Requires scope `deliveries:read`. Pass `{ "fast_forward": true }` to also pull delayed retries and receipts forward.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fast_forward: { type: boolean }
      responses:
        '200': { description: Processed }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, description: 'sn_test_... or sn_live_...' }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
  responses:
    Unauthenticated: { description: Missing or invalid API key (`unauthenticated`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 'Forbidden: `insufficient_scope`, `business_suspended`, `activation_required` (live billing is on and the business is not activated), `sandbox_only`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found (also returned for resources of another business or environment), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: 'Conflict: `idempotency_conflict`, `already_linked`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError: { description: 'Malformed or unknown fields (`validation_error`, `invalid_json`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: 'Rule violated: `setup_required`, `consent_required`, `invalid_phone`, `link_not_allowed`, `otp_invalid`, `otp_expired`, `otp_locked`, `unprocessable`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited: { description: Too many requests; see the Retry-After header, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, example: validation_error }
            message: { type: string }
            request_id: { type: string }
            fields: { type: object, additionalProperties: { type: array, items: { type: string } } }
    Customer:
      type: object
      additionalProperties: false
      required: [external_customer_id, name]
      properties:
        external_customer_id: { type: string }
        name: { type: string, maxLength: 120 }
        whatsapp_phone: { type: string, example: '+2348012345678' }
        email: { type: string, format: email }
    CreateInvoice:
      type: object
      additionalProperties: false
      required: [external_order_id, document_type, payment, customer, currency, items, channels]
      properties:
        external_order_id: { type: string }
        document_type: { type: string, enum: [invoice, receipt] }
        payment:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, enum: [paid, unpaid] }
            reference: { type: string, description: Required for receipts }
        customer: { $ref: '#/components/schemas/Customer' }
        currency: { type: string, example: NGN }
        tax_mode: { type: string, enum: [exclusive, inclusive], default: exclusive }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [description, quantity, unit_amount_minor]
            properties:
              description: { type: string, maxLength: 200 }
              quantity: { oneOf: [{ type: number }, { type: string }], description: 'Up to 3 decimal places' }
              unit_amount_minor: { type: integer, minimum: 0 }
              tax_rate_percent: { type: number, minimum: 0, maximum: 100 }
        discount_minor: { type: integer, minimum: 0 }
        due_date: { type: string, format: date }
        notes: { type: string, maxLength: 500 }
        channels: { type: array, items: { type: string, enum: [whatsapp, telegram] }, minItems: 1 }
        consent:
          type: object
          properties:
            whatsapp_transactional: { type: boolean }
        scenario: { type: string, description: 'Sandbox only. See the sandbox guide.' }
    DeliveryRef:
      type: object
      required: [id, channel, status, simulated]
      properties:
        id: { type: string }
        channel: { type: string, enum: [whatsapp, telegram] }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        simulated: { type: boolean }
        error_code: { type: string }
    DeliveryStatus:
      type: string
      enum: [queued, processing, provider_accepted, sent, delivered, read, retrying, failed, expired, blocked, sandbox_simulated]
    Invoice:
      type: object
      required: [id, object, status, environment, number, document_type, external_order_id, currency, amounts, payment, pdf, deliveries, request_id]
      properties:
        id: { type: string }
        object: { type: string, enum: [invoice] }
        status: { type: string, enum: [accepted] }
        environment: { type: string, enum: [sandbox, live] }
        number: { type: string, example: INV-000123 }
        document_type: { type: string, enum: [invoice, receipt] }
        external_order_id: { type: string }
        currency: { type: string }
        amounts:
          type: object
          required: [subtotal_minor, discount_minor, tax_minor, total_minor]
          properties:
            subtotal_minor: { type: integer }
            discount_minor: { type: integer }
            tax_minor: { type: integer }
            total_minor: { type: integer }
        payment:
          type: object
          required: [status]
          properties:
            status: { type: string }
            reference: { type: string }
        pdf:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [pending, ready] }
            url: { type: string }
            url_expires_in_seconds: { type: integer }
        deliveries: { type: array, items: { $ref: '#/components/schemas/DeliveryRef' } }
        request_id: { type: string }
    CreateOtp:
      type: object
      additionalProperties: false
      required: [phone, purpose]
      properties:
        phone: { type: string }
        purpose: { type: string, enum: [login, phone_verification, transaction_confirmation, account_recovery] }
        customer_ref: { type: string }
        scenario: { type: string }
    VerifyOtp:
      type: object
      additionalProperties: false
      required: [code, phone, purpose]
      properties:
        code: { type: string, pattern: '^\d{4,8}$' }
        phone: { type: string }
        purpose: { type: string, enum: [login, phone_verification, transaction_confirmation, account_recovery] }
    OtpChallenge:
      type: object
      required: [id, object, status, purpose, phone, expires_at, attempts_remaining]
      properties:
        id: { type: string }
        object: { type: string, enum: [otp_challenge] }
        status: { type: string, enum: [pending, verified, expired, locked, superseded] }
        purpose: { type: string }
        phone: { type: string, description: Masked }
        expires_at: { type: string, format: date-time }
        attempts_remaining: { type: integer }
        resend_available_at: { type: string, format: date-time }
        delivery: { $ref: '#/components/schemas/DeliveryRef' }
        request_id: { type: string }
    CreateNotification:
      type: object
      additionalProperties: false
      required: [type, customer, channels]
      properties:
        type: { type: string, enum: [order_confirmation, payment_confirmation, shipping_update, general_update] }
        customer: { $ref: '#/components/schemas/Customer' }
        channels: { type: array, items: { type: string, enum: [whatsapp, telegram] }, minItems: 1 }
        fields:
          type: object
          additionalProperties: false
          properties:
            order_reference: { type: string }
            amount_minor: { type: integer }
            currency: { type: string }
            message: { type: string, maxLength: 300 }
        link:
          type: object
          required: [url]
          properties:
            url: { type: string, format: uri }
        consent:
          type: object
          properties:
            whatsapp_transactional: { type: boolean }
        scenario: { type: string }
    Notification:
      type: object
      required: [id, object, status, type, deliveries, request_id]
      properties:
        id: { type: string }
        object: { type: string, enum: [notification] }
        status: { type: string, enum: [accepted] }
        type: { type: string }
        deliveries: { type: array, items: { $ref: '#/components/schemas/DeliveryRef' } }
        request_id: { type: string }
    Delivery:
      type: object
      required: [id, object, kind, channel, status, simulated, environment, attempts, created_at]
      properties:
        id: { type: string }
        object: { type: string, enum: [delivery] }
        kind: { type: string, enum: [invoice, otp, notification] }
        channel: { type: string, enum: [whatsapp, telegram] }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        simulated: { type: boolean }
        environment: { type: string, enum: [sandbox, live] }
        invoice_id: { type: string }
        challenge_id: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
        attempts:
          type: array
          items:
            type: object
            properties:
              attempt: { type: integer }
              outcome: { type: string }
              error_code: { type: string }
              at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CreateLinkToken:
      type: object
      additionalProperties: false
      required: [external_customer_id]
      properties:
        external_customer_id: { type: string }
        name: { type: string }
        force_relink: { type: boolean }
    LinkToken:
      type: object
      required: [id, object, external_customer_id, url, expires_at]
      properties:
        id: { type: string }
        object: { type: string, enum: [telegram_link_token] }
        external_customer_id: { type: string }
        url: { type: string, example: 'https://t.me/<bot>?start=<opaque_token>' }
        expires_at: { type: string, format: date-time }
        sandbox: { type: boolean }
webhooks:
  sendnaroEvent:
    post:
      summary: Events Sendnaro sends to your endpoint
      description: |
        Event types: `invoice.generated`, `invoice.failed`, `delivery.sent`, `delivery.delivered`,
        `delivery.failed`, `otp.verified` (only ids and the outcome, never the code).
        Header `Sendnaro-Signature: t=<unix>,v1=<hex hmac-sha256(secret, "<t>.<raw body>")>`.
        Respond 2xx; non-2xx responses are retried with backoff. Retries never resend the customer message.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, object, type, created, livemode, data]
              properties:
                id: { type: string, example: evt_cm0abc123 }
                object: { type: string, enum: [event] }
                type: { type: string }
                created: { type: integer }
                livemode: { type: boolean }
                data: { type: object }
      responses:
        '200': { description: Acknowledged }
