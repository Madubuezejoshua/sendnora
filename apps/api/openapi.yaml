  # --- API keys ----------------------------------------------------------
  /api-keys:
    get:
      summary: List API keys for the active workspace (management only — see below)
      tags: [API keys]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Key list (never includes the plaintext key)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKeySummary' }
    post:
      summary: >
        Issue a new API key. The plaintext key is returned exactly once, in
        this response only. NOTE: no route currently authenticates a request
        using an issued key — this endpoint exists to let you provision and
        revoke key records ahead of that feature. See HANDOVER.md.
      tags: [API keys]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Created key, including the one-time plaintext value
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/ApiKeySummary'
                      - type: object
                        properties:
                          key: { type: string, description: Plaintext key, shown once }
  /api-keys/{id}/revoke:
    post:
      summary: Revoke an API key (irreversible)
      tags: [API keys]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Revoked

