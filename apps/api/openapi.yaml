      tags: [Public]
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [PAYSTACK, FLUTTERWAVE] }
      responses:
        '200':
          description: Gateway checkout URL
  /public/invoices/{token}/pdf:
    get:
      summary: Download a publicly-viewable invoice PDF
      tags: [Public]
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: PDF file
          content:
            application/pdf: {}
  /public/quotes/{token}:
    get:
